<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>樂動捕手_關卡選擇</title>
    <link href="css/styles.css" rel="stylesheet">
</head>

<body>
    <div class="screen screen-level-select">

        <!-- 上：比例 0.5 -->
        <section class="level-zone zone-top"></section>

        <!-- 中：比例 3 -->
        <section class="level-zone zone-header">
            <img class="header-image" src="assets/webp/levelselection.webp" alt="關卡選擇" width="2637" height="551">
        </section>

        <!-- 下：比例 6.5 -->
        <section class="level-zone zone-levels">
            <div class="level-btn-group">

                <!-- 關卡 1：形狀獵人 -->
                <button type="button" class="ribbon-btn ribbon-btn--yellow" data-href="level_intro.html?level=1">
                    <svg class="ribbon-btn__shape" viewBox="0 0 500 100" preserveAspectRatio="none" aria-hidden="true">
                        <path class="ribbon-path-bg ribbon-path-stroke"
                            d="M 25 6 L 475 6 A 10 10 0 0 1 484 11 L 455 50 L 484 89 A 10 10 0 0 1 475 94 L 25 94 A 10 10 0 0 1 16 89 L 45 50 L 16 11 A 10 10 0 0 1 25 6 Z"
                            stroke-width="7" stroke-linejoin="round" stroke-linecap="round" />
                    </svg>
                    <img class="ribbon-btn__img" src="assets/webp/level1_title_orange.webp" alt="第一關 形狀獵人" width="1671"
                        height="343">
                </button>

                <!-- 關卡 2：方向快手 -->
                <button type="button" class="ribbon-btn ribbon-btn--blue" data-href="level_intro.html?level=2"> <svg
                        class="ribbon-btn__shape" viewBox="0 0 500 100" preserveAspectRatio="none" aria-hidden="true">
                        <path class="ribbon-path-bg ribbon-path-stroke"
                            d="M 25 6 L 475 6 A 10 10 0 0 1 484 11 L 455 50 L 484 89 A 10 10 0 0 1 475 94 L 25 94 A 10 10 0 0 1 16 89 L 45 50 L 16 11 A 10 10 0 0 1 25 6 Z"
                            stroke-width="7" stroke-linejoin="round" stroke-linecap="round" />
                    </svg>
                    <img class="ribbon-btn__img" src="assets/webp/level2_title_blue.webp" alt="第二關 方向快手" width="1632"
                        height="339">
                </button>

                <!-- 關卡 3：色字挑戰 -->
                <button type="button" class="ribbon-btn ribbon-btn--green" data-href="level_intro.html?level=3"> <svg
                        class="ribbon-btn__shape" viewBox="0 0 500 100" preserveAspectRatio="none" aria-hidden="true">
                        <path class="ribbon-path-bg ribbon-path-stroke"
                            d="M 25 6 L 475 6 A 10 10 0 0 1 484 11 L 455 50 L 484 89 A 10 10 0 0 1 475 94 L 25 94 A 10 10 0 0 1 16 89 L 45 50 L 16 11 A 10 10 0 0 1 25 6 Z"
                            stroke-width="7" stroke-linejoin="round" stroke-linecap="round" />
                    </svg>
                    <img class="ribbon-btn__img" src="assets/webp/level3_title_green.webp" alt="第三關 色字挑戰" width="1417"
                        height="289">
                </button>

            </div>
        </section>

    </div>
    <script src="js/scripts.js"></script>
</body>

</html>
